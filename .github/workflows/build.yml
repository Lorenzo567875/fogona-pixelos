name: Build PixelOS

on:
  workflow_dispatch:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      
    - name: Install build requirements
      run: |
        sudo apt-get update
        sudo apt-get install -y git python3 python3-pip openjdk-17-jdk
        
    - name: Sync PixelOS source
      run: |
        mkdir pixelos
        cd pixelos
        repo init -u https://github.com/PixelOS-AOSP/manifest.git -b fifteen --depth=1
        repo sync -c -j4 --no-tags
        
    - name: Clone device tree
      run: |
        cd pixelos
        cp -r ../fogona/* device/motorola/fogona/ 2>/dev/null || true
        
    - name: Build
      run: |
        cd pixelos
        source build/envsetup.sh
        lunch lineageos_fogona-userdebug
        mka bacon -j4
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: PixelOS-fogona
        path: pixelos/out/target/product/fogona/*.zip
