name: Build crDroid

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      
      - name: Install build requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 python3-pip openjdk-17-jdk curl
      
      - name: Sync crDroid source
        run: |
          cd 
          repo init -u https://github.com/crdroidandroid/android.git -b 15.0 --depth=1
          repo sync -c -j4 --no-tags
        
      - name: Copy device trees
        run: |
          cd 
          cp -rf fogona device/motorola/fogona
          cp -rf sm6225-common device/motorola/sm6225-common 2>/dev/null || true
        
      - name: Build
        run: |
          cd 
          source build/envsetup.sh
          lunch lineageos_fogona-userdebug
          mka bacon -j4
        
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: crDroid-fogona
          path: /out/target/product/fogona/*.zip
