name: Build PixelOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      
    - name: Install build requirements
      run: |
        sudo apt-get update
        sudo apt-get install -y git python3 python3-pip openjdk-17-jdk
      
    - name: Sync PixelOS source
      run: |
        mkdir -p pixelos
        cd pixelos
        repo init -u https://github.com/PixelOS-AOSP/manifest.git -b fifteen --depth=1
        repo sync -c -j4 --no-tags
        
    - name: Copy device trees
      run: |
        cd pixelos
        cp -rf ../fogona device/motorola/fogona
        cp -rf ../sm6225-common device/motorola/sm6225-common
        
    - name: Build
      run: |
        cd pixelos
        source build/envsetup.sh
        lunch lineageos_fogona-userdebug
        mka bacon -j4
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: PixelOS-fogona
        path: pixelos/out/target/product/fogona/*.zip
